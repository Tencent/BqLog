                break
              fi
            done
            
            if [ -n "$JAVA_HOME" ] && [ -x "$JAVA_HOME/bin/java" ] && [ -f "$JAVA_HOME/include/jni.h" ]; then
              export JAVA_HOME
              PATH="$JAVA_HOME/bin:$PATH"; export PATH
              java -version
              echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
              echo "PATH=$PATH" >> "$GITHUB_ENV"
