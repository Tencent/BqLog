  #Android
  build_windows_android:
    runs-on: windows-2022
    needs: extract_version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK (with NDK)
        id: setup-android
        uses: android-actions/setup-android@v4

      - name: Install Android CMake
        shell: pwsh
        run: |
          $cmakeDir = Join-Path $env:ANDROID_SDK_ROOT "cmake\3.22.1"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if (Test-Path (Join-Path $cmakeDir "bin\cmake.exe")) { exit 0 }
            Remove-Item $cmakeDir -Recurse -Force -ErrorAction SilentlyContinue
            sdkmanager "cmake;3.22.1"
            if ($LASTEXITCODE -eq 0 -and (Test-Path (Join-Path $cmakeDir "bin\cmake.exe"))) { exit 0 }
            Start-Sleep -Seconds (30 * $attempt)
          }
          throw "Failed to install Android CMake 3.22.1"

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          local-cache: false

      - name: Build for Windows Android
        run: |
          cd build\lib\android
          .\win_build_all_and_pack.bat
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}

