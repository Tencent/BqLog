  # netbsd_x86_64
  build_netbsd_x86_64_libs_Clang:
    runs-on: ubuntu-22.04
    needs: extract_version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Run in NetBSD (Clang, x86_64)
        id: vm_step_1
        continue-on-error: true
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          mem: 8192
          release: "10.1"
          prepare: |
            set -e
            export PATH="/usr/sbin:/usr/bin:/usr/pkg/sbin:/usr/pkg/bin:$PATH"

            ARCH="$(uname -m)"
            case "$ARCH" in
              evbarm|aarch64|arm64) PKG_ARCH="aarch64" ;;
              *) PKG_ARCH="$ARCH" ;;
            esac
            PKG_MIRRORS="
              https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/${PKG_ARCH}/10.1/All
              https://ftp.jaist.ac.jp/pub/pkgsrc/packages/NetBSD/${PKG_ARCH}/10.1/All
              https://mirrors.nju.edu.cn/pkgsrc/packages/NetBSD/${PKG_ARCH}/10.1/All
            "
            pkg_installed=0
            for mirror in $PKG_MIRRORS; do
              echo "=== Trying package mirror: $mirror ==="
              export PKG_PATH="$mirror"
              if /usr/sbin/pkg_add -v pkgin; then
                echo "$mirror" | sed 's|/All$|/All|' > /usr/pkg/etc/pkgin/repositories.conf || true
                pkgin -y update || true
                pkgin -y install cmake gmake bash gdb || true
                pkgin -y install clang || true
                pkgin -y install gcc12 || pkgin -y install gcc13 || pkgin -y install gcc10 || true
                pkg_installed=1
                break
              fi
              echo "Mirror $mirror failed, trying next..."
            done
            if [ "$pkg_installed" -ne 1 ]; then
              echo "WARNING: All package mirrors failed, continuing anyway..." >&2
            fi

            URLS=""
            case "$ARCH" in
              amd64|x86_64)
                URLS="https://cdn.netbsd.org/pub/NetBSD/NetBSD-10.1/amd64/binary/sets/xbase.tar.xz https://ftp.jaist.ac.jp/pub/NetBSD/NetBSD-10.1/amd64/binary/sets/xbase.tar.xz https://mirrors.tuna.tsinghua.edu.cn/NetBSD/NetBSD-10.1/amd64/binary/sets/xbase.tar.xz"
                ;;
              aarch64|arm64|evbarm)
                URLS="https://cdn.netbsd.org/pub/NetBSD/NetBSD-10.1/evbarm-aarch64/binary/sets/xbase.tar.xz https://ftp.jaist.ac.jp/pub/NetBSD/NetBSD-10.1/evbarm-aarch64/binary/sets/xbase.tar.xz https://mirrors.tuna.tsinghua.edu.cn/NetBSD/NetBSD-10.1/evbarm-aarch64/binary/sets/xbase.tar.xz"
                ;;
              *)
                echo "Unknown arch $ARCH; please set xbase URL manually" >&2
                exit 1
                ;;
            esac

            fetched=0
            for u in $URLS; do
              echo "Fetching $u"
              if /usr/bin/ftp -o /tmp/xbase.tar.xz "$u"; then
                tar -xJpf /tmp/xbase.tar.xz -C /
                fetched=1
                break
              fi
            done
            if [ "$fetched" -ne 1 ]; then
              echo "Failed to fetch/extract xbase.tar.xz" >&2
              exit 1
            fi
            ls /usr/X11R7/lib/libX11.so.* >/dev/null 2>&1 || { echo "xbase extracted but libX11 missing"; exit 1; }

            pkgin -y install openjdk17 || true
          run: |
            set -e -x
            export JAVA_HOME="/usr/pkg/java/openjdk17"
            export PATH="$JAVA_HOME/bin:/usr/pkg/bin:/usr/pkg/sbin:$PATH"
            java -version
            echo "JAVA_HOME=${JAVA_HOME:-}" >> "$GITHUB_ENV"
            echo "PATH=$PATH" >> "$GITHUB_ENV"

            # Use Clang (NetBSD base provides clang)
            export CC=clang CXX=clang++
            clang --version || true

            cd build/lib/unix_like
            chmod +x *.sh 2>/dev/null || true
            ls -l
            export BQ_UNIX_VERSION=netbsd
            ./build_all_and_pack.sh native clang YES NO NO

