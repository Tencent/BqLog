name: Build
on:  
  workflow_dispatch:  # manually trigger
  workflow_call:
    outputs:
      version:
        description: "Extracted version string"
        value: ${{ jobs.extract_version.outputs.version }}

permissions:
  contents: write

jobs:
  #########################################################Extract Version######################################################
  extract_version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract version
        id: extract
        run: |
          VERSION="$(sed -n 's/.*BQ_LOG_VERSION *= *"\(.*\)".*/\1/p' src/bq_log/global/version.cpp | head -n1)"
          if [[ -z "$VERSION" ]]; then
            echo "Failed to extract version"
            exit 1
          fi
          echo "VERSION=$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  #########################################################Common Libs Build####################################################
  #Windows
  build_windows_x86_64_lib_MSVC:
    runs-on: windows-2022
    needs: extract_version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build for Windows
        run: |
          cd build\lib\win64  
          .\build_all_and_pack.bat native msvc YES NO NO

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows_x86_64_libs_${{ needs.extract_version.outputs.version }}
          path: ${{ github.workspace }}/dist

  build_windows_x86_64_lib_Clang:
    runs-on: windows-2022
    needs: extract_version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build for Windows
        run: |
          cd build\lib\win64  
          .\build_all_and_pack.bat native clang YES NO NO

  build_windows_x86_64_lib_MinGW:
    runs-on: windows-2022
    needs: extract_version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java (JDK 11)
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install MSYS2 (CLANG64)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          release: true
          path-type: inherit
          install: >-
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-ninja

      - name: Remove conflicting MinGW paths
        shell: powershell
        run: |
          $env:Path = $env:Path -replace 'C:\\mingw64\\bin;','' -replace 'C:\\Program Files\\Git\\mingw64\\bin;',''
          echo "PATH=$env:Path" >> $env:GITHUB_ENV

      - name: Add MSYS2 CLANG64 to PATH
        shell: powershell
        run: |
          $bin = "${{ steps.msys2.outputs.msys2-location }}\clang64\bin"
          echo $bin
          echo $bin >> $env:GITHUB_PATH

      - name: Toolchain check
        shell: powershell
        run: |
          clang --version
          ninja --version
          where clang
          where ninja
          cmake --version

      - name: Build (x64)
        shell: cmd
        run: |
          cd build\lib\win64
          call build_all_and_pack.bat native mingw YES NO NO

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows_mingw_x86_64_libs_${{ needs.extract_version.outputs.version }}
          path: ${{ github.workspace }}/dist

  build_windows_x86_64_tools:
