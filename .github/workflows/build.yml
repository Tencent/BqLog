  nodejs_collect_and_stage_prebuilds:
    runs-on: ubuntu-22.04
    needs:
      - extract_version
      - nodejs_build_windows_x86_64_lib_MSVC
      - nodejs_build_windows_arm64_lib_MSVC
      - nodejs_build_ubuntu_x86_64_lib_Clang
      - nodejs_build_ubuntu_arm64_lib_Clang
      - nodejs_build_debian_x86_lib_Clang
      - nodejs_build_mac_lib
      - nodejs_build_freebsd_x86_64_libs_Clang
      - nodejs_build_freebsd_arm64_libs_Clang
      - nodejs_build_openbsd_x86_64_libs_Clang
      - nodejs_build_openbsd_arm64_libs_Clang
      - nodejs_build_solaris_x86_64_libs_GCC
      - nodejs_build_omnios_x86_64_libs_GCC
      - nodejs_build_dragonflybsd_x86_64_libs_Clang
      - nodejs_build_netbsd_x86_64_libs_Clang
      - nodejs_build_netbsd_arm64_libs_Clang
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all artifacts from native builds
        uses: actions/download-artifact@v8
        with:
          pattern: tmp_node_*
          merge-multiple: false
          path: downloaded_artifacts

      - name: List all archives
        shell: bash
        run: |
          set -euo pipefail
          ls -l downloaded_artifacts

      - name: Prepare tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Stage RelWithDebInfo BqLog.node (+pdb) into wrapper/typescript/prebuilds
        shell: bash
        run: |
          set -euo pipefail
          TS_DIR="wrapper/typescript"
          PREBUILDS_DIR="$TS_DIR/prebuilds"
          mkdir -p "$PREBUILDS_DIR"

          map_target() {
            # Map archive folder name to prebuilds/<plat-arch>
            # Input: archive base name (e.g., PACKAGE-windows-x86_64-1.2.3)
            local name="$1"
            local lowered="${name,,}"
            if [[ "$lowered" == *macos*universal* ]]; then
              echo "darwin-universal"  # special marker, handled later (copy to two dirs)
            elif [[ "$lowered" == *windows*arm64* ]]; then
              echo "win32-arm64"
            elif [[ "$lowered" == *windows* ]]; then
              # default windows x64
              echo "win32-x64"
            elif [[ "$lowered" == *freebsd*arm64* ]]; then
              echo "freebsd-arm64"
            elif [[ "$lowered" == *freebsd* ]]; then
              echo "freebsd-x64"
            elif [[ "$lowered" == *openbsd*arm64* ]]; then
              echo "openbsd-arm64"
            elif [[ "$lowered" == *openbsd* ]]; then
              echo "openbsd-x64"
            elif [[ "$lowered" == *netbsd*arm64* ]]; then
              echo "netbsd-arm64"
            elif [[ "$lowered" == *netbsd* ]]; then
              echo "netbsd-x64"
            elif [[ "$lowered" == *dragonfly* ]]; then
              echo "dragonfly-x64"
            elif [[ "$lowered" == *omnios* || "$lowered" == *solaris* || "$lowered" == *sunos* ]]; then
              echo "sunos-x64"
            elif [[ "$lowered" == *linux*arm64* ]]; then
              echo "linux-arm64"
            elif [[ "$lowered" == *linux*x86_64* || "$lowered" == *linux*amd64* ]]; then
              echo "linux-x64"
            elif [[ "$lowered" == *linux*x86* || "$lowered" == *debian*x86* || "$lowered" == *i386* ]]; then
              echo "linux-ia32"
            else
              # Fallback unknown
              echo ""
            fi
          }

          copied_any=0
          shopt -s globstar nullglob
          for d in downloaded_artifacts/*/*; do
            base="$(basename "$d")"
            target="$(map_target "$base")"
            if [[ -z "$target" ]]; then
              echo "Skip: cannot determine prebuild target for $base"
              continue
            fi

            # Find RelWithDebInfo/BqLog.node
            mapfile -t nodes < <(find "$d" -type f -path "*/RelWithDebInfo/*" -name "BqLog.node" 2>/dev/null || true)
            if (( ${#nodes[@]} == 0 )); then
              echo "No RelWithDebInfo/BqLog.node found in $base, skipping."
              continue
            fi

            # Prefer the first match
            node_src="${nodes[0]}"
            echo "::group::Stage from $base -> $target"
            if [[ "$target" == "darwin-universal" ]]; then
              for tdir in "darwin-x64" "darwin-arm64"; do
                mkdir -p "$PREBUILDS_DIR/$tdir"
                cp -f "$node_src" "$PREBUILDS_DIR/$tdir/BqLog.node"
              done
            else
              mkdir -p "$PREBUILDS_DIR/$target"
              cp -f "$node_src" "$PREBUILDS_DIR/$target/BqLog.node"
              # Optional PDB (Windows builds)
              pdb="$(dirname "$node_src")/BqLog.pdb"
              if [[ -f "$pdb" ]]; then
                cp -f "$pdb" "$PREBUILDS_DIR/$target/BqLog.pdb"
              fi
            fi
            echo "::endgroup::"
            copied_any=1
          done

          if [[ "$copied_any" -ne 1 ]]; then
            echo "Error: No prebuilds were staged."
            exit 1
          fi

      - name: List staged prebuilds
        run: |
          find wrapper/typescript/prebuilds -maxdepth 2 -type f -print | sort

      - name: Build NPM
        run: |
          cd build/wrapper/nodejs
          chmod +x *.sh
          ./build_all_and_pack.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: nodejs_npm_${{ needs.extract_version.outputs.version }}
          path: ${{ github.workspace }}/dist
          
      - name: Delete intermediate artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: tmp_node_* 
          failOnError: false

  # Unreal plugin
  unreal_plugin_build_on_linux:
    runs-on: ubuntu-22.04
    needs: extract_version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: build plugin
        run: |
          cd build/plugin/unreal
          chmod +x *.sh
          ./linux_build_all_and_pack.sh

      - name: Reorganize dist for upload
        shell: bash
        env:
          VERSION: ${{ needs.extract_version.outputs.version }}
        run: |
          set -euo pipefail
          DIST="${{ github.workspace }}/dist"
          # Generic UE4/UE5 zip: root is BqLog/ (what users get from GitHub Release).
          # The .uplugin EngineVersion stays as the two-segment "4.27" / "5.8" set by
          # linux_build_all_and_pack.sh — two-segment values fail FEngineVersion::Parse,
          # which makes FPluginManager::IsPluginCompatible short-circuit to true, so the
          # plugin loads cleanly on any 4.22~4.27 / 5.0~5.8 without the "load anyway?" dialog.
          for ue in ue4 ue5; do
            mkdir -p "$DIST/$ue"
            (cd "$DIST/$ue" && unzip -q "$DIST/bqlog-unreal-plugin-${VERSION}-${ue}.zip")
          done

          # Fab zips: one zip per supported engine minor version.
          # Each zip ships with .uplugin rewritten so:
          #   - EngineVersion is the three-segment "X.Y.0" matching that Fab Project Version
          #     (Fab's review pipeline validates this field per listing).
          #   - UE4 targets use the legacy WhitelistPlatforms/BlacklistPlatforms keys
          #     (UE 4.27 and earlier ModuleDescriptor.cpp only reads those).
          #   - UE5 targets use PlatformAllowList/PlatformDenyList
          #     (UE 5.x ModuleDescriptor.cpp reads those first; legacy names remain as fallback).
          #   - Linux arm64 platform string differs: UE4 uses "LinuxAArch64", UE5 uses "LinuxArm64".
          rewrite_uplugin_for_fab() {
            local plugin_dir="$1"        # directory containing BqLog.uplugin
            local ue_major="$2"          # 4 or 5
            local ue_minor="$3"          # 22, 23, ... 27 or 0, 1, ... 8
            local uplugin="$plugin_dir/BqLog.uplugin"

            # Set EngineVersion to "X.Y"
            sed -i -E \
              "s/\"EngineVersion\"[[:space:]]*:[[:space:]]*\"[^\"]*\"/\"EngineVersion\": \"${ue_major}.${ue_minor}\"/" \
              "$uplugin"

            if [[ "$ue_major" == "4" ]]; then
              # UE4 ModuleDescriptor.cpp only recognizes the legacy key names.
              sed -i 's/"PlatformAllowList"/"WhitelistPlatforms"/g' "$uplugin"
              sed -i 's/"PlatformDenyList"/"BlacklistPlatforms"/g' "$uplugin"
              # UE4 Linux arm64 target is spelled LinuxAArch64 (added in 4.25).
              sed -i 's/"LinuxArm64"/"LinuxAArch64"/g' "$uplugin"

              # UE 4.22~4.24 predate several tokens we use by default:
              #   - ModuleHostType.UncookedOnly was introduced in 4.24.
              #     4.22/4.23 reject it with "Missing or invalid 'Type' field"
              #     (Enum.TryParse<ModuleHostType> fails). Fall back to Editor,
              #     which is the closest pre-4.24 equivalent for BqLogBPNodes
              #     (blueprint-graph helpers that only load inside the editor).
              #   - UnrealTargetPlatform.LinuxAArch64 was introduced in 4.25.
              #     4.22/4.23/4.24 reject the platform name with
              #     "The platform name LinuxAArch64 is not a valid platform name".
              if (( ue_minor < 24 )); then
                # 4.22, 4.23: strip UncookedOnly entirely.
                sed -i 's/"UncookedOnly"/"Editor"/g' "$uplugin"
              fi
              if (( ue_minor < 25 )); then
                # 4.22, 4.23, 4.24: remove LinuxAArch64 (with surrounding comma
                # and optional whitespace) from platform arrays.
                #   ", \"LinuxAArch64\"" → ""   (middle or tail element)
                #   "\"LinuxAArch64\", "  → ""  (leading element)
                #   "\"LinuxAArch64\""    → ""  (sole element, fallback)
                sed -i -E \
                  -e 's/,[[:space:]]*"LinuxAArch64"//g' \
                  -e 's/"LinuxAArch64"[[:space:]]*,[[:space:]]*//g' \
                  -e 's/"LinuxAArch64"//g' \
                  "$uplugin"
              fi
            fi
          }

          build_fab_zip() {
            local ue_variant="$1"        # ue4 or ue5
            local ue_major="$2"
            local ue_minor="$3"
            local src_dir="$DIST/$ue_variant/BqLog"
            local stage_dir="$DIST/fab_stage_ue_${ue_major}_${ue_minor}"
            local out_dir="$DIST/fab_ue_${ue_major}_${ue_minor}"

            rm -rf "$stage_dir" "$out_dir"
            mkdir -p "$stage_dir" "$out_dir"

            # Fab zip layout: plugin contents at zip root (no BqLog/ wrapper).
            cp -R "$src_dir/." "$stage_dir/"
            rewrite_uplugin_for_fab "$stage_dir" "$ue_major" "$ue_minor"
            cp -R "$stage_dir/." "$out_dir/"
          }

          for minor in 22 23 24 25 26 27; do
            build_fab_zip ue4 4 "$minor"
          done
          for minor in 0 1 2 3 4 5 6 7 8; do
            build_fab_zip ue5 5 "$minor"
          done

      - name: Upload UE4 Source Artifact
        uses: actions/upload-artifact@v6
        with:
          name: unreal_plugin_sources_ue4_${{ needs.extract_version.outputs.version }}
          path: ${{ github.workspace }}/dist/ue4

      - name: Upload UE5 Source Artifact
        uses: actions/upload-artifact@v6
        with:
          name: unreal_plugin_sources_ue5_${{ needs.extract_version.outputs.version }}
          path: ${{ github.workspace }}/dist/ue5

      - name: Upload UE4 Fab Source Artifacts (4.22~4.27)
        uses: actions/upload-artifact@v6
        with:
          name: _dont_download_this_only_for_fab_ue_4_22_${{ needs.extract_version.outputs.version }}
          path: ${{ github.workspace }}/dist/fab_ue_4_22

      - uses: actions/upload-artifact@v6
        with:
          name: _dont_download_this_only_for_fab_ue_4_23_${{ needs.extract_version.outputs.version }}
          path: ${{ github.workspace }}/dist/fab_ue_4_23

      - uses: actions/upload-artifact@v6
        with:
          name: _dont_download_this_only_for_fab_ue_4_24_${{ needs.extract_version.outputs.version }}
          path: ${{ github.workspace }}/dist/fab_ue_4_24

      - uses: actions/upload-artifact@v6
        with:
          name: _dont_download_this_only_for_fab_ue_4_25_${{ needs.extract_version.outputs.version }}
          path: ${{ github.workspace }}/dist/fab_ue_4_25

      - uses: actions/upload-artifact@v6
        with:
          name: _dont_download_this_only_for_fab_ue_4_26_${{ needs.extract_version.outputs.version }}
          path: ${{ github.workspace }}/dist/fab_ue_4_26

      - uses: actions/upload-artifact@v6
        with:
          name: _dont_download_this_only_for_fab_ue_4_27_${{ needs.extract_version.outputs.version }}
          path: ${{ github.workspace }}/dist/fab_ue_4_27

      - name: Upload UE5 Fab Source Artifacts (5.0~5.8)
        uses: actions/upload-artifact@v6
        with:
          name: _dont_download_this_only_for_fab_ue_5_0_${{ needs.extract_version.outputs.version }}
          path: ${{ github.workspace }}/dist/fab_ue_5_0

      - uses: actions/upload-artifact@v6
        with:
          name: _dont_download_this_only_for_fab_ue_5_1_${{ needs.extract_version.outputs.version }}
          path: ${{ github.workspace }}/dist/fab_ue_5_1

      - uses: actions/upload-artifact@v6
        with:
          name: _dont_download_this_only_for_fab_ue_5_2_${{ needs.extract_version.outputs.version }}
          path: ${{ github.workspace }}/dist/fab_ue_5_2

      - uses: actions/upload-artifact@v6
        with:
          name: _dont_download_this_only_for_fab_ue_5_3_${{ needs.extract_version.outputs.version }}
          path: ${{ github.workspace }}/dist/fab_ue_5_3

      - uses: actions/upload-artifact@v6
        with:
          name: _dont_download_this_only_for_fab_ue_5_4_${{ needs.extract_version.outputs.version }}
          path: ${{ github.workspace }}/dist/fab_ue_5_4

      - uses: actions/upload-artifact@v6
        with:
          name: _dont_download_this_only_for_fab_ue_5_5_${{ needs.extract_version.outputs.version }}
          path: ${{ github.workspace }}/dist/fab_ue_5_5

      - uses: actions/upload-artifact@v6
        with:
          name: _dont_download_this_only_for_fab_ue_5_6_${{ needs.extract_version.outputs.version }}
          path: ${{ github.workspace }}/dist/fab_ue_5_6

      - uses: actions/upload-artifact@v6
        with:
          name: _dont_download_this_only_for_fab_ue_5_7_${{ needs.extract_version.outputs.version }}
          path: ${{ github.workspace }}/dist/fab_ue_5_7

      - uses: actions/upload-artifact@v6
        with:
          name: _dont_download_this_only_for_fab_ue_5_8_${{ needs.extract_version.outputs.version }}
          path: ${{ github.workspace }}/dist/fab_ue_5_8

