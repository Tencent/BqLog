name: BSD Deps Snapshot

# Regenerates the self-hosted BSD dependency snapshots used by build.yml.
#
# Background: upstream BSD package repos delete packages for EOL releases
# (all OpenBSD < 7.7 packages are already gone from every mirror), which
# breaks pinned CI over time. The snapshot freezes the install-time
# dependency closure of the build toolchain into an immutable tarball,
# published as an OCI artifact on GHCR; build jobs install from there.
#
# The walkers are pure HTTP (no VM/root): they parse the official package
# catalog/+CONTENTS and download the full dependency closure.
#
# Manual only. After the artifacts are produced, push them with oras:
#   oras push ghcr.io/pippocao/bqlog-ci-deps/bsd:<target> \
#     --artifact-type application/vnd.bqlog.deps.tar+gzip \
#     <target>-deps.tar.gz:application/gzip
# (needs a token with write:packages, e.g. stored as the GHCR_PAT secret)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'snapshot target (see build/ci/snapshot/make_snapshots.sh)'
        required: true
        default: 'freebsd-amd64'

permissions:
  contents: read

jobs:
  snapshot:
    name: snapshot_${{ inputs.target }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build dependency closure
        run: |
          chmod +x build/ci/snapshot/make_snapshots.sh
          bash build/ci/snapshot/make_snapshots.sh "${{ inputs.target }}"

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v6
        with:
          name: deps-${{ inputs.target }}
          path: |
            build/ci/snapshot/dist/*-deps.tar.gz
            build/ci/snapshot/dist/*-deps.tar.gz.sha256
