  # Python Tests (FreeBSD - requires VM)
  python_test_freebsd_x86_64:
    name: python_wrapper (freebsd_x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # A failing test fails the job. The only retry left is prepare's package fetch.
      - name: Run in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          mem: 8192
          prepare: |
            for i in 1 2 3 4 5; do
              if pkg install -y llvm cmake bash python3; then
                PYVER=$(python3 -c 'import sys; print(f"{sys.version_info[0]}{sys.version_info[1]}")')
                if pkg install -y "py${PYVER}-pip" "py${PYVER}-setuptools" "py${PYVER}-wheel"; then
                  exit 0
                fi
                echo "py${PYVER}-pip package unavailable, bootstrapping with ensurepip..."
                if python3 -m ensurepip --upgrade && python3 -m pip install --upgrade pip setuptools wheel; then
                  exit 0
                fi
              fi
              echo "Install failed, retrying in 60s... ($i/5)"
              sleep 60
            done
            exit 1
          run: |
            set +e
            cd build/test/python
            chmod +x run_unix.sh
            bash run_unix.sh clang
            EXIT_CODE=$?
            set -e
            if [ $EXIT_CODE -ne 0 ]; then
              echo "Test failed with exit code $EXIT_CODE"
              exit $EXIT_CODE
            fi

  go_wrapper_tests:
    name: go_wrapper (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script_path: build/test/go/run_linux.sh
            label: "ubuntu-latest"
          - os: ubuntu-24.04-arm
            script_path: build/test/go/run_linux.sh
            label: "ubuntu-24.04-arm"
          - os: macos-latest
            script_path: build/test/go/run_mac.sh
            label: "macos-latest"
          - os: windows-latest
            script_path: build/test/go/run_win.bat
            label: "windows-latest"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.21.x'
          cache: false

      - name: Install CMake
        if: runner.os == 'Windows'
        uses: lukka/get-cmake@latest

      # cgo needs a gcc compatible compiler; UCRT64 links the same C runtime as the MSVC built bqlog dll
      - name: Install MSYS2 UCRT64 (Attempt 1)
        id: msys2
        if: runner.os == 'Windows'
        continue-on-error: true
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: true
          path-type: inherit
          update: true

      - name: Ensure MSYS2 packages (Attempt 2)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm --needed --overwrite '*' mingw-w64-ucrt-x86_64-gcc
          which gcc
      - name: Ensure MSYS2 packages (Attempt 3)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm --needed --overwrite '*' mingw-w64-ucrt-x86_64-gcc
          which gcc

      - name: Put UCRT64 gcc first in PATH
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $msys = "${{ steps.msys2.outputs.msys2-location }}"
          if (-not $msys) { $msys = "C:\msys64" }
          $env:Path = $env:Path -replace 'C:\\mingw64\\bin;','' -replace 'C:\\Program Files\\Git\\mingw64\\bin;',''
          $env:Path = "$msys\ucrt64\bin;" + $env:Path
          echo "PATH=$env:Path" >> $env:GITHUB_ENV
          where.exe gcc
          gcc -dumpmachine

      - name: Run Go Tests
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            ./${{ matrix.script_path }}
          else
            chmod +x ${{ matrix.script_path }}
            ./${{ matrix.script_path }}
          fi

  go_wrapper_freebsd_x86_64:
    name: go_wrapper (freebsd_x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # A failing test fails the job. The only retry left is prepare's package fetch.
      - name: Run in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          mem: 8192
          prepare: |
            for i in 1 2 3 4 5; do
              if pkg install -y llvm cmake bash go; then
                exit 0
              fi
              echo "Install failed, retrying in 60s... ($i/5)"
              sleep 60
            done
            exit 1
          run: |
            set +e
            export CC=clang
            cd build/test/go
            chmod +x run_unix.sh
            bash run_unix.sh clang
            EXIT_CODE=$?
            set -e
            if [ $EXIT_CODE -ne 0 ]; then
              echo "Test failed with exit code $EXIT_CODE"
              exit $EXIT_CODE
            fi

  # Same sources compiled with the capability set of a console target: every optional
  # feature is switched off, so the degraded code paths really run.
  linux_degraded_capabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Build and run with every capability disabled
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++
          cmake -S test/cpp -B build_degraded -DTARGET_PLATFORM=linux -DCMAKE_BUILD_TYPE=Debug \
            -DBQ_CAPABILITY_OVERRIDES="BQ_HAS_MMAP=0;BQ_HAS_CROSS_PROCESS_FILE_LOCK=0;BQ_HAS_CRASH_HANDLER=0;BQ_HAS_BACKTRACE=0;BQ_HAS_DIRENT=0;BQ_HAS_THREAD_NAME=0;BQ_HAS_USER_COUNTER=0;BQ_HAS_POSIX_MEMALIGN=0;BQ_HAS_FDATASYNC=0;BQ_HAS_GETPAGESIZE=0;BQ_HAS_DEFAULT_BASE_DIR=0"
          cmake --build build_degraded -j 4
          ./build_degraded/BqLogUnitTest

  # FreeBSD built with the PlayStation platform branch: platform detection, the capability
  # combination and all conditional compilation match a PS5 build, only libc differs.
  freebsd_as_ps5:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Run in FreeBSD with the PlayStation branch
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          mem: 8192
          prepare: |
            pkg install -y cmake
          run: |
            set -e
            cmake -S test/cpp -B build_ps5 -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_CXX_FLAGS="-D__PROSPERO__"
            grep -q '^TARGET_PLATFORM:STRING=ps5$' build_ps5/CMakeCache.txt
            cmake --build build_ps5 -j 4
            ./build_ps5/BqLogUnitTest
