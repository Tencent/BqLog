name: AutoTest
on:
  workflow_dispatch:  # manually trigger
    inputs:
      run_arm_tests:
        description: 'Run slow ARM test jobs'
        required: false
        type: boolean
        default: false
  workflow_call:
jobs:
  #The layout a package manager installs, verified through find_package and pkg-config.
  install_verify:
    name: install verify (${{ matrix.label }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "ubuntu-22.04"
            runs_on: ubuntu-22.04
          - label: "macos-latest"
            runs_on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify the standard install
        run: bash build/pack_test/install_verify.sh

  #The C++20 module interface unit: precompiled into a BMI, imported and run.
  module_verify:
    name: module verify (${{ matrix.label }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "ubuntu-24.04"
            runs_on: ubuntu-24.04
          - label: "macos-latest"
            runs_on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Apple clang does not implement the C++20 module syntax at all -- even `export module foo;`
      # fails to parse -- so macOS needs upstream LLVM. See pack/homebrew/README.md.
      - name: Install upstream LLVM (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm

      - name: Verify the module interface unit
        run: |
          if [ "${RUNNER_OS}" = "macOS" ]; then
            LLVM="$(brew --prefix llvm)"
            export CC="${LLVM}/bin/clang"
            export CXX="${LLVM}/bin/clang++"
          else
            export CXX=clang++
          fi
          bash build/pack_test/module_verify.sh

  #The module entry under GCC (the default GCC 13 cannot build modules).
  # GCC 14 crashes with an internal compiler error (nonnull_arg_p) on a module that imports
  # bq.log, so the module test wants 15 or newer; both supported versions run here, in their
  # upstream images, which is also where the compiler comes from.
  module_verify_gcc:
    name: module verify (gcc ${{ matrix.gcc }})
    runs-on: ubuntu-24.04
    container: gcc:${{ matrix.gcc }}
    strategy:
      fail-fast: false
      matrix:
        gcc: [ "15", "16" ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install CMake and Ninja
        run: |
          apt-get update
          apt-get install -y cmake ninja-build
          cmake --version | head -1
          ninja --version

      - name: Build and run the module entry test
        run: |
          cmake -S test/cpp -B build_module_gcc -G Ninja -DTARGET_PLATFORM=linux \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCPP_VER=20
          cmake --build build_module_gcc --target BqLogModuleUnitTest --parallel 2
          test -f build_module_gcc/bq_module_test_enabled \
            || { echo "GCC ${{ matrix.gcc }} must get the module test (the image needs CMake 3.28+); see test/cpp/CMakeLists.txt" >&2; exit 1; }
          cd build_module_gcc
          ./BqLogModuleUnitTest

  #The Homebrew formula, built from an archive of this commit.
  homebrew_formula:
    name: homebrew formula
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Point the formula at this commit
        run: |
          VERSION="$(sed -n 's/.*BQ_LOG_VERSION = "\(.*\)".*/\1/p' src/bq_log/global/version.cpp)"
          TARBALL="$RUNNER_TEMP/Release_${VERSION}.tar.gz"
          git archive --format=tar.gz --prefix="BqLog-Release_${VERSION}/" -o "$TARBALL" HEAD
          BQ_FORMULA_URL="file://$TARBALL" bash pack/homebrew/bump.sh "$VERSION" "$TARBALL"
          brew tap-new --no-git bqlog/ci
          cp pack/homebrew/Formula/bqlog.rb "$(brew --repository)/Library/Taps/bqlog/homebrew-ci/Formula/"

      - name: Install, test and check the style
        run: |
          brew install --build-from-source bqlog/ci/bqlog
          brew test bqlog/ci/bqlog
          brew style bqlog/ci/bqlog

  #The vcpkg port, built from an archive of this commit.
  vcpkg_port:
    name: vcpkg port (${{ matrix.triplet }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - triplet: x64-linux
            runs_on: ubuntu-24.04
          - triplet: x64-windows
            runs_on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Bootstrap vcpkg (linux)
        if: runner.os != 'Windows'
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg vcpkg_tool
          ./vcpkg_tool/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg (windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg vcpkg_tool
          call vcpkg_tool\bootstrap-vcpkg.bat -disableMetrics

      # vcpkg_from_github takes the archive from its download cache when the file name and SHA512 match.
      - name: Point the port at this commit
        shell: bash
        run: |
          VERSION="$(sed -n 's/.*BQ_LOG_VERSION = "\(.*\)".*/\1/p' src/bq_log/global/version.cpp)"
          mkdir -p vcpkg_tool/downloads
          TARBALL="vcpkg_tool/downloads/Tencent-BqLog-Release_${VERSION}.tar.gz"
          git archive --format=tar.gz --prefix="BqLog-Release_${VERSION}/" -o "$TARBALL" HEAD
          bash pack/vcpkg/bump.sh "$VERSION" "$TARBALL"

      # The tools-free install is the `bqlog[core]` case upstream CI runs: it is where an empty
      # bin/ or debug/bin/ left behind by the build system fails the post-build checks.
      - name: Install the port without features
        shell: bash
        run: |
          ./vcpkg_tool/vcpkg install bqlog \
            --overlay-ports=pack/vcpkg/ports --triplet "${{ matrix.triplet }}"

      - name: Install the port with the tools feature
        shell: bash
        run: |
          ./vcpkg_tool/vcpkg install "bqlog[tools]" --recurse \
            --overlay-ports=pack/vcpkg/ports --triplet "${{ matrix.triplet }}"

      - name: Assert the installed layout
        shell: bash
        run: |
          installed="vcpkg_tool/installed/${{ matrix.triplet }}"
          test -d "$installed/tools/bqlog" || { echo "the tools feature installed no tools" >&2; exit 1; }
          if find "$installed/lib" -name '*.dll' -print -quit | grep -q .; then
            echo "a DLL is under lib/" >&2
            exit 1
          fi

  #The NuGet package: pack one RID and publish a consumer against it.
  nuget_package:
    name: nuget package (win-x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build the native library (win-x64)
        run: |
          cmake -S . -B build_nuget -A x64 -DBUILD_LIB_TYPE=dynamic_lib -DBQ_BUILD_TOOLS=OFF -DBQ_WERROR=OFF -DCMAKE_INSTALL_PREFIX=nuget_prefix
          cmake --build build_nuget --config Release --parallel 2
          cmake --install build_nuget --config Release
          if (Test-Path nuget_prefix/lib/BqLog.dll) {
            throw "the DLL must install under bin/, not lib/"
          }

      - name: Assemble the native runtimes
        run: |
          New-Item -ItemType Directory -Force -Path artifacts_in/windows_x86_64_libs_local | Out-Null
          Copy-Item nuget_prefix/bin/BqLog.dll artifacts_in/windows_x86_64_libs_local/
          bash pack/nuget/collect_runtimes.sh artifacts_in pack/nuget windows_x86_64_libs

      - name: Pack
        shell: pwsh
        run: |
          # The version lives in src/bq_log/global/version.cpp, never in the csproj.
          $version = (Select-String -Path src/bq_log/global/version.cpp -Pattern 'BQ_LOG_VERSION = "(.*?)"').Matches[0].Groups[1].Value
          dotnet pack pack/nuget/BqLog.csproj -c Release -p:Version=$version -o nuget_out
          if ($LASTEXITCODE -ne 0) { throw "dotnet pack failed" }

      - name: Publish a consumer against the packed nupkg
        shell: pwsh
        run: |
          $version = (Select-String -Path src/bq_log/global/version.cpp -Pattern 'BQ_LOG_VERSION = "(.*?)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path consumer | Out-Null

          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <AssemblyName>consumer</AssemblyName>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="BqLog" Version="$version" />
            </ItemGroup>
          </Project>
          "@ | Set-Content -Encoding utf8 consumer/consumer.csproj

          @'
          class Program
          {
              static int Main()
              {
                  // create_log rejects a config without an appenders_config object, so name one.
                  bq.log log_inst = bq.log.create_log("nuget_consumer",
                      "log.thread_mode=sync\n"
                      + "appenders_config.console.type=console\n"
                      + "appenders_config.console.levels=[all]");
                  if (!log_inst.is_valid())
                  {
                      System.Console.Error.WriteLine("create_log failed");
                      return 1;
                  }
                  log_inst.info("bqlog installed through NuGet: {}", 1);
                  log_inst.force_flush();
                  return 0;
              }
          }
          '@ | Set-Content -Encoding utf8 consumer/Program.cs

          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="../nuget_out" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          "@ | Set-Content -Encoding utf8 consumer/nuget.config

          dotnet publish consumer/consumer.csproj -c Release -r win-x64 -o consumer_out
          ./consumer_out/consumer.exe
          if ($LASTEXITCODE -ne 0) {
            throw "the consumer failed to run with a RID"
          }

          # Without a RID the SDK still copies runtimes/<rid>/native and the host finds it through
          # deps.json, so the plain .NET path gets its own check.
          dotnet run --project consumer/consumer.csproj -c Release
          if ($LASTEXITCODE -ne 0) {
            throw "the consumer failed to run without a RID"
          }

          # .NET Framework ignores runtimes/, so the package's buildTransitive targets must copy the
          # native library. This is the only check of that path.
          New-Item -ItemType Directory -Force -Path consumer_framework | Out-Null
          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net48</TargetFramework>
              <AssemblyName>consumer_framework</AssemblyName>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="BqLog" Version="$version" />
              <PackageReference Include="Microsoft.NETFramework.ReferenceAssemblies" Version="1.0.3" PrivateAssets="all" />
            </ItemGroup>
          </Project>
          "@ | Set-Content -Encoding utf8 consumer_framework/consumer_framework.csproj
          Copy-Item consumer/Program.cs consumer_framework/Program.cs
          Copy-Item consumer/nuget.config consumer_framework/nuget.config

          dotnet build consumer_framework/consumer_framework.csproj -c Release -o consumer_framework_out
          if ($LASTEXITCODE -ne 0) {
            throw "the .NET Framework consumer failed to build"
          }
          if (-not (Test-Path consumer_framework_out/BqLog.dll)) {
            throw "the buildTransitive targets did not copy BqLog.dll for .NET Framework"
          }
          ./consumer_framework_out/consumer_framework.exe
          if ($LASTEXITCODE -ne 0) {
            throw "the .NET Framework consumer failed to run"
          }

  #Windows
  win64:
    name: win64 (${{ matrix.cc }} cpp${{ matrix.cpp_ver }} ${{ matrix.runner.label }})
    runs-on: ${{ matrix.runner.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        cc: [ msvc, clang, mingw_clang, mingw_gcc ]
        cpp_ver: [ 11, 14, 17, 20, 23 ]
        runner:
          - label: "x86_64"
            runs_on: windows-latest
          - label: "arm64"
            runs_on: windows-11-arm
        exclude:
          - cc: mingw_gcc
            runner:
              label: "arm64"
              runs_on: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Clang(Attempt 1)
        if: ${{ matrix.runner.runs_on == 'windows-11-arm' }}
        continue-on-error: true
        shell: bash
        run: |
          choco uninstall -y llvm --all-versions || true
          choco install -y llvm
      - name: Install Clang(Attempt 2)
        if: ${{ matrix.runner.runs_on == 'windows-11-arm' }}
        continue-on-error: true
        shell: bash
        run: |
          choco install -y llvm
      - name: Install Clang(Attempt 3)
        if: ${{ matrix.runner.runs_on == 'windows-11-arm' }}
        continue-on-error: true
        shell: bash
        run: |
          choco install -y llvm

      - name: Install MSYS2 UCRT64 (Attempt 1)
        id: msys2
        if: ${{ matrix.cc == 'mingw_gcc' }}
        continue-on-error: true
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: true
          path-type: inherit
          update: true

      - name: Ensure MSYS2 packages (Attempt 2)
        if: ${{ matrix.cc == 'mingw_gcc' }}
        continue-on-error: true
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm --needed --overwrite '*' mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils mingw-w64-ucrt-x86_64-make
          echo "MSYS2 Root: $MSYSTEM_CARCH"
          which gcc
          which mingw32-make
      - name: Ensure MSYS2 packages (Attempt 3)
        if: ${{ matrix.cc == 'mingw_gcc' }}
        continue-on-error: true
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm --needed --overwrite '*' mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils mingw-w64-ucrt-x86_64-make
          echo "MSYS2 Root: $MSYSTEM_CARCH"
          which gcc
          which mingw32-make
      - name: Ensure MSYS2 packages (Attempt 4)
        if: ${{ matrix.cc == 'mingw_gcc' }}
        continue-on-error: true
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm --needed --overwrite '*' mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils mingw-w64-ucrt-x86_64-make
          echo "MSYS2 Root: $MSYSTEM_CARCH"
          which gcc
          which mingw32-make

      - name: Remove conflicting MinGW paths
        if: ${{ matrix.cc == 'mingw_gcc' }}
        run: |
          $env:Path = $env:Path -replace 'C:\\mingw64\\bin;','' -replace 'C:\\Program Files\\Git\\mingw64\\bin;',''
          echo "PATH=$env:Path" >> $env:GITHUB_ENV
        shell: powershell
      - name: Add MSYS2 to PATH
        if: ${{ matrix.cc == 'mingw_gcc' }}
        run: |
          $msys = "${{ steps.msys2.outputs.msys2-location }}"
          if (-not $msys) { $msys = "C:\msys64" }
          $env:Path = "$msys\ucrt64\bin;" + $env:Path
          echo "PATH=$env:Path" >> $env:GITHUB_ENV
        shell: powershell

      - name: Enable WER LocalDumps (BqLogUnitTest.exe)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dumpDir = Join-Path $env:GITHUB_WORKSPACE "win_dumps"
          New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
          Write-Host "Dump dir: $dumpDir"

          # Use HKCU to avoid requiring elevated permissions.
          $key = "HKCU:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\BqLogUnitTest.exe"
          New-Item -Force -Path $key | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value $dumpDir -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType   -PropertyType DWord       -Value 2       -Force | Out-Null  # 2 = full dump
          New-ItemProperty -Path $key -Name DumpCount  -PropertyType DWord       -Value 10      -Force | Out-Null

          Get-ItemProperty -Path $key | Format-List

      - name: Build for Windows
        id: win_run_tests
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          cd build\test\win64
          # Avoid any interactive `pause` hanging CI.
          cmd /c "call .\run_test_${{ matrix.cc }}.bat ${{ matrix.cpp_ver }} <nul"
          $code = $LASTEXITCODE
          "exitcode=$code" >> $env:GITHUB_OUTPUT
          Write-Host "BqLogUnitTest exitcode=$code"
          exit 0

      - name: Print crash stack from dump (cdb)
        if: steps.win_run_tests.outputs.exitcode != '0'
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $dumpDir = Join-Path $env:GITHUB_WORKSPACE "win_dumps"
          Write-Host "Dump dir: $dumpDir"
          $dumps = Get-ChildItem -Path $dumpDir -Filter *.dmp -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending
          if (-not $dumps) {
            Write-Host "No .dmp found (process may have terminated without WER dump)."
            exit 0
          }

          $dump = $dumps[0].FullName
          Write-Host "Using dump: $dump"

          $cdb = (Get-Command cdb.exe -ErrorAction SilentlyContinue).Source
          if (-not $cdb) {
            $candidates = @(
              "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe",
              "C:\Program Files (x86)\Windows Kits\11\Debuggers\x64\cdb.exe",
              "C:\Program Files (x86)\Windows Kits\10\Debuggers\x86\cdb.exe",
              "C:\Program Files (x86)\Windows Kits\11\Debuggers\x86\cdb.exe"
            )
            foreach ($p in $candidates) { if (Test-Path $p) { $cdb = $p; break } }
          }

          if (-not $cdb) {
            Write-Host "cdb.exe not found, attempting to install WinDbg via Chocolatey..."
            choco install -y windbg --no-progress
            $cdb = (Get-Command cdb.exe -ErrorAction SilentlyContinue).Source
            if (-not $cdb) {
              $candidates = @(
                "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe",
                "C:\Program Files (x86)\Windows Kits\11\Debuggers\x64\cdb.exe"
              )
              foreach ($p in $candidates) { if (Test-Path $p) { $cdb = $p; break } }
            }
          }

          if (-not $cdb) {
            Write-Host "Still no cdb.exe found. Dump will still be uploaded as artifact."
            exit 0
          }

          Write-Host "Using cdb: $cdb"
          Write-Host "=== cdb analysis begin ==="
          & $cdb -z $dump -c "!analyze -v; .ecxr; kv; q" 2>&1
          Write-Host "=== cdb analysis end ==="

      - name: Upload Windows crash dumps (if any)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: win_dumps_${{ matrix.runner.label }}_${{ matrix.cc }}_cpp${{ matrix.cpp_ver }}
          path: win_dumps/**
          if-no-files-found: ignore

      - name: Fail job if tests failed
        if: steps.win_run_tests.outputs.exitcode != '0'
        shell: powershell
        run: exit 1


  #Multi-instance regression
  multi_instance:
    name: multi_instance (${{ matrix.os.label }})
    runs-on: ${{ matrix.os.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - label: "windows"
            runs_on: windows-latest
          - label: "ubuntu"
            runs_on: ubuntu-latest
          - label: "macos"
            runs_on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Prepare legacy 2.6.0 checkout (ubuntu)
        if: ${{ matrix.os.label == 'ubuntu' }}
        run: |
          # FETCH_HEAD, not the sha again: a fetch of a bare sha leaves no ref behind, so
          # naming the commit a second time depends on the clone and the git version.
          git fetch --no-tags --depth=1 origin 948d05079b73d12c7f980372a28b82fd1bba5c6c
          git worktree add --detach /tmp/bq260 FETCH_HEAD

      - name: Configure and build (windows)
        if: ${{ matrix.os.label == 'windows' }}
        shell: pwsh
        run: |
          cmake -S test/multi_instance -B build_mi
          cmake --build build_mi --config Release --parallel 2

      - name: Configure and build (linux/macos)
        if: ${{ matrix.os.label != 'windows' }}
        run: |
          cmake -S test/multi_instance -B build_mi \
            ${{ matrix.os.label == 'ubuntu' && '-DBQ_LEGACY_SRC=/tmp/bq260' || '' }}
          cmake --build build_mi --parallel 2

      # ctest on every platform: it resolves the worker path and the per-case output
      # directory itself, so no shell-specific find/$(...) is needed (the previous
      # bash-ism did not run under the default pwsh on Windows)
      - name: Run multi-instance cases
        run: |
          ctest --test-dir build_mi --output-on-failure -R multi_instance -C Release

  #Linux-ubuntu
  ubuntu:
    name: ubuntu (${{ matrix.runner.label }} ${{ matrix.cc }} ${{ matrix.cpp_ver }} ${{ matrix.asan.label }})
    runs-on: ${{ matrix.runner.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - label: "x86_64"
            runs_on: ubuntu-latest
          - label: "arm64"
            runs_on: ubuntu-24.04-arm
        asan:
          - label: "asan"
            assan_switch: TRUE
          - label: " "
            assan_switch: FALSE
        cc: [ clang, gcc ]
        cpp_ver: [ 11, 14, 17, 20, 23 ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install GDB(Attempt 1)
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y gdb ninja-build
      - name: Install GDB(Attempt 2)
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y gdb ninja-build
      - name: Install GDB(Attempt 3)
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y gdb ninja-build       

      - name: Build for Linux
        if: ${{ matrix.asan.label != 'asan' || (matrix.runner.label == 'x86_64' && matrix.cc == 'clang' && matrix.cpp_ver == 17) || github.event.inputs.run_arm_tests == true || github.event.inputs.run_arm_tests == 'true' }}
        env:
          BQ_ENABLE_ASAN: ${{ matrix.asan.assan_switch }}
        run: |
          cd build/test/linux
          chmod +x *.sh
          ./run_test_${{ matrix.cc }}.sh ${{ matrix.cpp_ver }}

  # The suite skips the recovery groups when the platform has no instance lock; that path is
  # unreachable on an ordinary runner, so build it once with the lock compiled out.
  recovery_capability:
    name: recovery capability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install ninja
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Run the suite without instance locks
        env:
          BQ_LOW_PERFORMANCE_TESTS: "true"
        run: |
          cmake -S test/cpp -B build_recovery_capability -G Ninja -DTARGET_PLATFORM=linux \
            -DCPP_VER=20 -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBQ_TEST_DISABLE_FILE_LOCK=ON
          cmake --build build_recovery_capability --target BqLogUnitTest --parallel 2
          cd build_recovery_capability
          ./BqLogUnitTest --instance-only
          ./BqLogUnitTest --appender-only
          ./BqLogUnitTest --fast-only
          ./BqLogUnitTest --meta-only
          ./BqLogUnitTest --fast-info-only

      - name: The multi-instance suite must skip, not fail, without locks
        run: |
          cmake -S test/multi_instance -B build_recovery_capability_mi -DBQ_TEST_DISABLE_FILE_LOCK=ON
          cmake --build build_recovery_capability_mi --parallel 2
          ctest --test-dir build_recovery_capability_mi -R multi_instance --output-on-failure

