      # The module entry test runs under Ninja; the Xcode generator used for the rest of the
      # suite cannot produce that target.
      - name: Install Ninja
        run: brew install ninja

      # A toolchain that implements C++20 modules; run_test.sh picks this clang++ up.
      - name: Install LLVM for the module test
