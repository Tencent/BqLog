<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080" viewBox="0 0 1280 1080" role="img" aria-labelledby="title desc"><title id="title">MISO: reservations, committed status and physical blocks</title><desc id="desc">A 128-byte-aligned cursor pair, mapped ring header, 128-byte allocation units, and an expanded chunk containing context and the internal log record.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#222b35" stroke-width="1.6"/></marker><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 9L9 0M7 11L11 7" stroke="#b8bec7" stroke-width="1"/></pattern></defs><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#222b35}.mono{font-family:Consolas,'Courier New',monospace}.note{fill:#64717e}.cell{stroke:#222b35;stroke-width:1.5}.line{fill:none;stroke:#222b35;stroke-width:1.7}.guide{fill:none;stroke:#8b96a2;stroke-width:1.2;stroke-dasharray:5 5}</style><rect width="1280" height="1080" fill="white"/>
<text x="28" y="38" font-size="25" text-anchor="start" font-weight="700">MISO: reservations, committed status and physical blocks</text>
<text x="28" y="71" font-size="16" text-anchor="start" class="note">Current BQ_CACHE_LINE_SIZE = 128 B is a library alignment/granularity choice, not a measured CPU cache-line size.</text>
<text x="28" y="119" font-size="19" text-anchor="start" font-weight="700">CURSORS · in the miso_ring_buffer object</text>
<rect class="cell" x="70" y="147" width="560" height="75" rx="0" fill="#ffd4d0"/>
<text x="350" y="178.45" font-size="17" text-anchor="middle">write_cursor: atomic uint32 + padding</text>
<text x="350" y="202.45" font-size="17" text-anchor="middle">128-byte lane · modified by producers</text>
<rect class="cell" x="630" y="147" width="560" height="75" rx="0" fill="#d8edd6"/>
<text x="910" y="178.45" font-size="17" text-anchor="middle">read_cursor: atomic uint32 + padding</text>
<text x="910" y="202.45" font-size="17" text-anchor="middle">128-byte lane · published by consumer</text>
<text x="28" y="278" font-size="19" text-anchor="start" font-weight="700">BACKING ALLOCATION · head_ and aligned_blocks_ point into it</text>
<rect class="cell" x="70" y="309" width="185" height="80" rx="0" fill="#f2f3f5"/>
<text x="162.5" y="342.95" font-size="17" text-anchor="middle">MISO head</text>
<text x="162.5" y="366.95" font-size="17" text-anchor="middle">128 B</text>
<rect class="cell" x="255" y="309" width="133.5" height="80" rx="0" fill="#ffd4d0"/>
<text x="321.75" y="342.95" font-size="17" text-anchor="middle">block 0</text>
<text x="321.75" y="366.95" font-size="17" text-anchor="middle">128 B</text>
<rect class="cell" x="388.5" y="309" width="133.5" height="80" rx="0" fill="#ffd4d0"/>
<text x="455.25" y="342.95" font-size="17" text-anchor="middle">block 1</text>
<text x="455.25" y="366.95" font-size="17" text-anchor="middle">128 B</text>
<rect class="cell" x="522" y="309" width="133.5" height="80" rx="0" fill="#d3eaff"/>
<text x="588.75" y="342.95" font-size="17" text-anchor="middle">block 2</text>
<text x="588.75" y="366.95" font-size="17" text-anchor="middle">128 B</text>
<rect class="cell" x="655.5" y="309" width="133.5" height="80" rx="0" fill="#d3eaff"/>
<text x="722.25" y="342.95" font-size="17" text-anchor="middle">block 3</text>
<text x="722.25" y="366.95" font-size="17" text-anchor="middle">128 B</text>
<rect class="cell" x="789" y="309" width="133.5" height="80" rx="0" fill="#d3eaff"/>
<text x="855.75" y="342.95" font-size="17" text-anchor="middle">block 4</text>
<text x="855.75" y="366.95" font-size="17" text-anchor="middle">128 B</text>
<rect class="cell" x="922.5" y="309" width="133.5" height="80" rx="0" fill="#f2f3f5"/>
<text x="989.25" y="342.95" font-size="17" text-anchor="middle">block 5</text>
<text x="989.25" y="366.95" font-size="17" text-anchor="middle">128 B</text>
<rect class="cell" x="1056" y="309" width="133.5" height="80" rx="0" fill="#f2f3f5"/>
<text x="1122.75" y="342.95" font-size="17" text-anchor="middle">block 6</text>
<text x="1122.75" y="366.95" font-size="17" text-anchor="middle">128 B</text>
<path d="M255 421V413H522V421" class="line"/>
<text x="388.5" y="405" font-size="16" text-anchor="middle">record A: 2 blocks</text>
<path d="M522 421V413H922.5V421" class="line"/>
<text x="722.25" y="405" font-size="16" text-anchor="middle">record B: 3 blocks</text>
<text x="28" y="479" font-size="19" text-anchor="start" font-weight="700">ONE CHUNK · offsets from the first block</text>
<path d="M70 517H1190" class="line"/>
<path d="M70 512V523" class="line"/>
<text x="70" y="507" font-size="14" text-anchor="middle" class="mono">+0</text>
<path d="M245 512V523" class="line"/>
<text x="245" y="507" font-size="14" text-anchor="middle" class="mono">+3</text>
<path d="M355 512V523" class="line"/>
<text x="355" y="507" font-size="14" text-anchor="middle" class="mono">+4</text>
<path d="M550 512V523" class="line"/>
<text x="550" y="507" font-size="14" text-anchor="middle" class="mono">+8</text>
<path d="M970 512V523" class="line"/>
<text x="970" y="507" font-size="14" text-anchor="middle" class="mono">+24</text>
<path d="M1190 512V523" class="line"/>
<text x="1190" y="507" font-size="14" text-anchor="middle" class="mono">...</text>
<rect class="cell" x="70" y="530" width="175" height="77" rx="0" fill="#ffd4d0"/>
<text x="157.5" y="562.45" font-size="17" text-anchor="middle">block_num</text>
<text x="157.5" y="586.45" font-size="17" text-anchor="middle">24 bits</text>
<rect class="cell" x="245" y="530" width="110" height="77" rx="0" fill="#fff0b8"/>
<text x="300" y="562.45" font-size="17" text-anchor="middle">status</text>
<text x="300" y="586.45" font-size="17" text-anchor="middle">8 bits</text>
<rect class="cell" x="355" y="530" width="195" height="77" rx="0" fill="#ffd4d0"/>
<text x="452.5" y="562.45" font-size="17" text-anchor="middle">data_size</text>
<text x="452.5" y="586.45" font-size="17" text-anchor="middle">uint32</text>
<rect class="cell" x="550" y="530" width="420" height="77" rx="0" fill="#d8edd6"/>
<text x="760" y="562.45" font-size="17" text-anchor="middle">LP context</text>
<text x="760" y="586.45" font-size="17" text-anchor="middle">16 B</text>
<rect class="cell" x="970" y="530" width="220" height="77" rx="0" fill="#d3eaff"/>
<text x="1080" y="562.45" font-size="17" text-anchor="middle">log record</text>
<text x="1080" y="586.45" font-size="17" text-anchor="middle">header + bytes</text>
<path d="M70 642V634H550V642" class="line"/>
<text x="310" y="626" font-size="16" text-anchor="middle">MISO chunk prefix = 8 B</text>
<text x="610" y="634" font-size="17" text-anchor="start">Payload data_size excludes this 8-byte prefix</text>
<text x="28" y="707" font-size="19" text-anchor="start" font-weight="700">PUBLICATION · allocation order is not completion order</text>
<rect class="cell" x="70" y="735" width="370" height="85" rx="0" fill="#fff0b8"/>
<text x="255" y="771.45" font-size="17" text-anchor="middle">A reserved first</text>
<text x="255" y="795.45" font-size="17" text-anchor="middle">status = unused (not committed)</text>
<rect class="cell" x="440" y="735" width="370" height="85" rx="0" fill="#d3eaff"/>
<text x="625" y="771.45" font-size="17" text-anchor="middle">B reserved second</text>
<text x="625" y="795.45" font-size="17" text-anchor="middle">status = used (committed)</text>
<rect class="cell" x="810" y="735" width="380" height="85" rx="0" fill="#d3eaff"/>
<text x="1000" y="771.45" font-size="17" text-anchor="middle">C reserved third</text>
<text x="1000" y="795.45" font-size="17" text-anchor="middle">status = used (committed)</text>
<path d="M90 885V829" class="line" marker-end="url(#arrow)"/>
<text x="70" y="914" font-size="18" text-anchor="start">Consumer waits here for A; B and C cannot make this shared prefix readable.</text>
<text x="70" y="960" font-size="17" text-anchor="start">Producer fills payload → release status=used → consumer acquire observes used → reads payload</text>
<text x="28" y="1018" font-size="16" text-anchor="start" class="note">After consumption, unused status and read_cursor are published in batches to reduce ownership traffic.</text>
<text x="28" y="1050" font-size="16" text-anchor="start" class="note">A 61-byte example record uses 8 + 16 + 61 = 85 bytes, rounded to one 128-byte MISO block.</text>
</svg>
