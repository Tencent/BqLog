<text x="70" y="525" font-size="18" text-anchor="start" class="mono">In=21 maps to slot 5; Out=14 maps to slot 14; used is still 7</text>
<text x="28" y="591" font-size="16" text-anchor="start" class="note">Reading data and releasing storage are separate operations. Do not expose a cursor before bytes are ready.</text>
<text x="28" y="626" font-size="16" text-anchor="start" class="note">Contiguous variable-sized records need an additional tail/wrap policy; a ring of bytes alone is not enough.</text>
