<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670" role="img" aria-labelledby="title desc"><title id="title">Ring buffer: logical cursors and physical addresses</title><desc id="desc">Sixteen slots show logical monotonic cursor arithmetic and wraparound, distinguishing free and readable slots.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#222b35" stroke-width="1.6"/></marker><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 9L9 0M7 11L11 7" stroke="#b8bec7" stroke-width="1"/></pattern></defs><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#222b35}.mono{font-family:Consolas,'Courier New',monospace}.note{fill:#64717e}.cell{stroke:#222b35;stroke-width:1.5}.line{fill:none;stroke:#222b35;stroke-width:1.7}.guide{fill:none;stroke:#8b96a2;stroke-width:1.2;stroke-dasharray:5 5}</style><rect width="1280" height="670" fill="white"/>
<text x="28" y="38" font-size="25" text-anchor="start" font-weight="700">Ring buffer: logical cursors and physical addresses</text>
<text x="28" y="71" font-size="16" text-anchor="start" class="note">Teaching example: 16 units; logical cursors increase. Physical slot = cursor &amp; 15.</text>
