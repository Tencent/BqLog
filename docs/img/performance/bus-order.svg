<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1010" viewBox="0 0 1280 1010" role="img" aria-labelledby="title desc"><title id="title">LP → HP → LP: sequencing follows one producer across buffers</title><desc id="desc">A sixteen-byte context is expanded and a timeline shows LP record sequence zero, HP block sequence one, and later LP record sequence two, with out-of-order discovery deferred.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#222b35" stroke-width="1.6"/></marker><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 9L9 0M7 11L11 7" stroke="#b8bec7" stroke-width="1"/></pattern></defs><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#222b35}.mono{font-family:Consolas,'Courier New',monospace}.note{fill:#64717e}.cell{stroke:#222b35;stroke-width:1.5}.line{fill:none;stroke:#222b35;stroke-width:1.7}.guide{fill:none;stroke:#8b96a2;stroke-width:1.2;stroke-dasharray:5 5}</style><rect width="1280" height="1010" fill="white"/>
<text x="28" y="38" font-size="25" text-anchor="start" font-weight="700">LP → HP → LP: sequencing follows one producer across buffers</text>
<text x="28" y="71" font-size="16" text-anchor="start" class="note">Sequence is per producer thread × Log. One LP record or one HP block lifetime consumes one sequence number.</text>
<text x="35" y="123" font-size="19" text-anchor="start" font-weight="700">CONTEXT HEAD · 16 B</text>
<path d="M65 155H1205" class="line"/>
<path d="M65 150V161" class="line"/>
<text x="65" y="145" font-size="14" text-anchor="middle" class="mono">+0</text>
<path d="M235 150V161" class="line"/>
<text x="235" y="145" font-size="14" text-anchor="middle" class="mono">+2</text>
<path d="M345 150V161" class="line"/>
<text x="345" y="145" font-size="14" text-anchor="middle" class="mono">+3</text>
<path d="M455 150V161" class="line"/>
<text x="455" y="145" font-size="14" text-anchor="middle" class="mono">+4</text>
<path d="M725 150V161" class="line"/>
<text x="725" y="145" font-size="14" text-anchor="middle" class="mono">+8</text>
<path d="M1205 150V161" class="line"/>
<text x="1205" y="145" font-size="14" text-anchor="middle" class="mono">+16</text>
<rect class="cell" x="65" y="168" width="170" height="83" rx="0" fill="#e8dafa"/>
<text x="150" y="203.45" font-size="17" text-anchor="middle">version</text>
<text x="150" y="227.45" font-size="17" text-anchor="middle">uint16</text>
<rect class="cell" x="235" y="168" width="110" height="83" rx="0" fill="#ffd4d0"/>
<text x="290" y="203.45" font-size="17" text-anchor="middle">finished</text>
<text x="290" y="227.45" font-size="17" text-anchor="middle">1 B</text>
<rect class="cell" x="345" y="168" width="110" height="83" rx="0" fill="#ffd4d0"/>
<text x="400" y="203.45" font-size="17" text-anchor="middle">external</text>
<text x="400" y="227.45" font-size="17" text-anchor="middle">1 B</text>
<rect class="cell" x="455" y="168" width="270" height="83" rx="0" fill="#fff0b8"/>
<text x="590" y="203.45" font-size="17" text-anchor="middle">seq</text>
<text x="590" y="227.45" font-size="17" text-anchor="middle">uint32</text>
<rect class="cell" x="725" y="168" width="480" height="83" rx="0" fill="#d8edd6"/>
<text x="965" y="203.45" font-size="17" text-anchor="middle">TLS identity slot</text>
<text x="965" y="227.45" font-size="17" text-anchor="middle">8 B even on 32-bit targets</text>
<text x="35" y="313" font-size="19" text-anchor="start" font-weight="700">PRODUCER CALL ORDER</text>
<path d="M65 342H1210" class="line" marker-end="url(#arrow)"/>
<rect class="cell" x="65" y="370" width="260" height="92" rx="0" fill="#d3eaff"/>
<text x="195" y="409.95" font-size="17" text-anchor="middle">LP: record A</text>
<text x="195" y="433.95" font-size="17" text-anchor="middle">context seq = 0</text>
<rect class="cell" x="325" y="370" width="530" height="92" rx="0" fill="#d8edd6"/>
<text x="590" y="409.95" font-size="17" text-anchor="middle">HP: record B | record C | ...</text>
<text x="590" y="433.95" font-size="17" text-anchor="middle">one shared block context seq = 1</text>
<rect class="cell" x="855" y="370" width="350" height="92" rx="0" fill="#d3eaff"/>
<text x="1030" y="409.95" font-size="17" text-anchor="middle">LP: record D</text>
<text x="1030" y="433.95" font-size="17" text-anchor="middle">context seq = 2</text>
<text x="65" y="501" font-size="18" text-anchor="start">HP block is marked removed when the producer switches back to LP.</text>
<text x="35" y="572" font-size="19" text-anchor="start" font-weight="700">CONSUMER MAY DISCOVER SOURCES IN A DIFFERENT ORDER</text>
<rect class="cell" x="65" y="600" width="210" height="95" rx="0" fill="#fff0b8"/>
<text x="170" y="641.45" font-size="17" text-anchor="middle">expected = 0</text>
<text x="170" y="665.45" font-size="17" text-anchor="middle">find HP seq=1</text>
<rect class="cell" x="275" y="600" width="285" height="95" rx="0" fill="#d3eaff"/>
<text x="417.5" y="641.45" font-size="17" text-anchor="middle">defer HP</text>
<text x="417.5" y="665.45" font-size="17" text-anchor="middle">consume LP A → expected=1</text>
<rect class="cell" x="560" y="600" width="370" height="95" rx="0" fill="#d8edd6"/>
<text x="745" y="641.45" font-size="17" text-anchor="middle">consume HP B, C ...</text>
<text x="745" y="665.45" font-size="17" text-anchor="middle">retire block → expected=2</text>
<rect class="cell" x="930" y="600" width="275" height="95" rx="0" fill="#d3eaff"/>
<text x="1067.5" y="641.45" font-size="17" text-anchor="middle">consume LP D</text>
<text x="1067.5" y="665.45" font-size="17" text-anchor="middle">expected becomes 3</text>
<path d="M276 728H1205" class="line" marker-end="url(#arrow)"/>
<text x="65" y="767" font-size="18" text-anchor="start">A temporarily empty HP block still has seq=1 until it is relinquished and drained.</text>
<text x="35" y="837" font-size="19" text-anchor="start" font-weight="700">WHY NOT PUT A GLOBAL SEQUENCE ON EVERY LOG?</text>
<text x="65" y="876" font-size="18" text-anchor="start">A global sequence adds a shared producer RMW; per-thread contexts preserve only the ordering needed here.</text>
<text x="28" y="934" font-size="16" text-anchor="start" class="note">Logs from different producer threads can appear out of timestamp order. The file therefore stores signed time deltas.</text>
<text x="28" y="972" font-size="16" text-anchor="start" class="note">Recovered TLS addresses identify old streams; they are not live pointers in the new process.</text>
</svg>
