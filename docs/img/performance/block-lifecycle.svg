<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" role="img" aria-labelledby="title desc"><title id="title">Block lists: indices change, ring payloads stay in place</title><desc id="desc">Four fixed blocks and Free Stage Used index chains show block handoff without moving live data.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#222b35" stroke-width="1.6"/></marker><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 9L9 0M7 11L11 7" stroke="#b8bec7" stroke-width="1"/></pattern></defs><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#222b35}.mono{font-family:Consolas,'Courier New',monospace}.note{fill:#64717e}.cell{stroke:#222b35;stroke-width:1.5}.line{fill:none;stroke:#222b35;stroke-width:1.7}.guide{fill:none;stroke:#8b96a2;stroke-width:1.2;stroke-dasharray:5 5}</style><rect width="1280" height="1040" fill="white"/>
<text x="28" y="38" font-size="25" text-anchor="start" font-weight="700">Block lists: indices change, ring payloads stay in place</text>
<text x="28" y="71" font-size="16" text-anchor="start" class="note">Illustrative four-block Group. Actual group size is 2 or 16. FFFF means no next block.</text>
<text x="35" y="122" font-size="19" text-anchor="start" font-weight="700">SAME ALLOCATION · fixed block addresses</text>
<rect class="cell" x="65" y="150" width="285" height="78" rx="0" fill="#d3eaff"/>
<text x="207.5" y="182.95" font-size="17" text-anchor="middle">block 0</text>
<text x="207.5" y="206.95" font-size="17" text-anchor="middle">B + 0S</text>
<rect class="cell" x="350" y="150" width="285" height="78" rx="0" fill="#d8edd6"/>
<text x="492.5" y="182.95" font-size="17" text-anchor="middle">block 1</text>
<text x="492.5" y="206.95" font-size="17" text-anchor="middle">B + 1S</text>
<rect class="cell" x="635" y="150" width="285" height="78" rx="0" fill="#fff0b8"/>
<text x="777.5" y="182.95" font-size="17" text-anchor="middle">block 2</text>
<text x="777.5" y="206.95" font-size="17" text-anchor="middle">B + 2S</text>
<rect class="cell" x="920" y="150" width="285" height="78" rx="0" fill="#d8edd6"/>
<text x="1062.5" y="182.95" font-size="17" text-anchor="middle">block 3</text>
<text x="1062.5" y="206.95" font-size="17" text-anchor="middle">B + 3S</text>
<text x="35" y="285" font-size="19" text-anchor="start" font-weight="700">A · before allocation</text>
<rect class="cell" x="65" y="309" width="195" height="48" rx="0" fill="#d3eaff"/>
<text x="162.5" y="338.95" font-size="17" text-anchor="middle">Used</text>
<rect class="cell" x="260" y="309" width="945" height="48" rx="0" fill="#ffffff"/>
<text x="732.5" y="338.95" font-size="17" text-anchor="middle">head = 0;  [0].next = FFFF</text>
<rect class="cell" x="65" y="374" width="195" height="48" rx="0" fill="#d8edd6"/>
<text x="162.5" y="403.95" font-size="17" text-anchor="middle">Free</text>
<rect class="cell" x="260" y="374" width="945" height="48" rx="0" fill="#ffffff"/>
<text x="732.5" y="403.95" font-size="17" text-anchor="middle">head = 1;  [1].next = 3;  [3].next = FFFF</text>
<rect class="cell" x="65" y="439" width="195" height="48" rx="0" fill="#fff0b8"/>
<text x="162.5" y="468.95" font-size="17" text-anchor="middle">Stage</text>
<rect class="cell" x="260" y="439" width="945" height="48" rx="0" fill="#ffffff"/>
<text x="732.5" y="468.95" font-size="17" text-anchor="middle">head = 2;  [2].next = FFFF</text>
<text x="35" y="537" font-size="19" text-anchor="start" font-weight="700">B · producer pops block 1, initializes context/SISO, pushes it to Stage</text>
<rect class="cell" x="65" y="561" width="195" height="48" rx="0" fill="#d3eaff"/>
<text x="162.5" y="590.95" font-size="17" text-anchor="middle">Used</text>
<rect class="cell" x="260" y="561" width="945" height="48" rx="0" fill="#ffffff"/>
<text x="732.5" y="590.95" font-size="17" text-anchor="middle">head = 0;  [0].next = FFFF</text>
<rect class="cell" x="65" y="626" width="195" height="48" rx="0" fill="#d8edd6"/>
<text x="162.5" y="655.95" font-size="17" text-anchor="middle">Free</text>
<rect class="cell" x="260" y="626" width="945" height="48" rx="0" fill="#ffffff"/>
<text x="732.5" y="655.95" font-size="17" text-anchor="middle">head = 3;  [3].next = FFFF</text>
<rect class="cell" x="65" y="691" width="195" height="48" rx="0" fill="#fff0b8"/>
<text x="162.5" y="720.95" font-size="17" text-anchor="middle">Stage</text>
<rect class="cell" x="260" y="691" width="945" height="48" rx="0" fill="#ffffff"/>
<text x="732.5" y="720.95" font-size="17" text-anchor="middle">head = 1;  [1].next = 2;  [2].next = FFFF</text>
<text x="35" y="807" font-size="19" text-anchor="start" font-weight="700">C · consumer links discovered blocks into Used, and eventually returns retired blocks to Free</text>
<rect class="cell" x="65" y="839" width="320" height="81" rx="0" fill="#ffd4d0"/>
<text x="225" y="873.45" font-size="17" text-anchor="middle">Removed?</text>
<text x="225" y="897.45" font-size="17" text-anchor="middle">producer relinquished ownership</text>
<rect class="cell" x="385" y="839" width="400" height="81" rx="0" fill="#d3eaff"/>
<text x="585" y="873.45" font-size="17" text-anchor="middle">Drained?</text>
<text x="585" y="897.45" font-size="17" text-anchor="middle">all committed records consumed</text>
<rect class="cell" x="785" y="839" width="420" height="81" rx="0" fill="#d8edd6"/>
<text x="995" y="873.45" font-size="17" text-anchor="middle">Recycle</text>
<text x="995" y="897.45" font-size="17" text-anchor="middle">unlink Used → push Free</text>
<text x="28" y="970" font-size="16" text-anchor="start" class="note">A block being empty is not enough: an active producer may write it again. Removed + drained permits recycling.</text>
<text x="28" y="1003" font-size="16" text-anchor="start" class="note">List CAS uses a relative index and finite ABA tag. Group allocation/removal uses locks outside ordinary writes.</text>
</svg>
