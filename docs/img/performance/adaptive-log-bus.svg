<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1270" viewBox="0 0 1280 1270" role="img" aria-labelledby="title desc"><title id="title">log_buffer: object pointers, Group allocation and SISO storage</title><desc id="desc">TLS metadata points to a block within a group allocation. The group contains three list heads and equally-strided block nodes, each with management bytes, a SISO object, a four-lane head and data area.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#222b35" stroke-width="1.6"/></marker><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 9L9 0M7 11L11 7" stroke="#b8bec7" stroke-width="1"/></pattern></defs><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#222b35}.mono{font-family:Consolas,'Courier New',monospace}.note{fill:#64717e}.cell{stroke:#222b35;stroke-width:1.5}.line{fill:none;stroke:#222b35;stroke-width:1.7}.guide{fill:none;stroke:#8b96a2;stroke-width:1.2;stroke-dasharray:5 5}</style><rect width="1280" height="1270" fill="white"/>
<text x="28" y="38" font-size="25" text-anchor="start" font-weight="700">log_buffer: object pointers, Group allocation and SISO storage</text>
<text x="28" y="71" font-size="16" text-anchor="start" class="note">C = 128 B in current code. D and stride S are symbolic because SISO object size depends on ABI/build.</text>
<text x="35" y="119" font-size="19" text-anchor="start" font-weight="700">THREAD-LOCAL OBJECT</text>
<rect class="cell" x="35" y="140" width="360" height="200" rx="0" fill="#f2f3f5"/>
<text x="55" y="175" font-size="18" text-anchor="start">log_tls_info</text>
<text x="55" y="200" font-size="18" text-anchor="start">last Log ID → cached info*</text>
<text x="55" y="225" font-size="18" text-anchor="start">log_map[Log ID] → info*</text>
<text x="55" y="269" font-size="18" text-anchor="start">log_tls_buffer_info</text>
<text x="55" y="294" font-size="18" text-anchor="start">cur_block* | frequency | seqs</text>
<text x="655" y="119" font-size="19" text-anchor="start" font-weight="700">LOG OBJECT / BUS</text>
<rect class="cell" x="655" y="140" width="580" height="200" rx="0" fill="#f2f3f5"/>
<text x="679" y="175" font-size="18" text-anchor="start">log_buffer</text>
<text x="679" y="200" font-size="18" text-anchor="start">LP miso_ring_buffer | HP group_list</text>
<text x="679" y="225" font-size="18" text-anchor="start">oversize buffer list | consumer traversal state</text>
<path d="M215 341V370H15V590H216" class="line" marker-end="url(#arrow)"/>
<text x="55" y="359" font-size="15" text-anchor="start" class="mono">cur_block*</text>
<path d="M949 341V380H610V420H225V430" class="line" marker-end="url(#arrow)"/>
<text x="960" y="365" font-size="16" text-anchor="start" class="mono">group_data_head*</text>
<text x="35" y="399" font-size="19" text-anchor="start" font-weight="700">GROUP BACKING ALLOCATION</text>
<rect class="cell" x="35" y="431" width="190" height="74" rx="0" fill="#f2f3f5"/>
<text x="130" y="461.95" font-size="17" text-anchor="middle">checksum metadata</text>
<text x="130" y="485.95" font-size="17" text-anchor="middle">C B, mmap only</text>
<rect class="cell" x="225" y="431" width="310" height="74" rx="0" fill="#d3eaff"/>
<text x="380" y="461.95" font-size="17" text-anchor="middle">used_</text>
<text x="380" y="485.95" font-size="17" text-anchor="middle">C B</text>
<rect class="cell" x="535" y="431" width="310" height="74" rx="0" fill="#d8edd6"/>
<text x="690" y="461.95" font-size="17" text-anchor="middle">free_</text>
<text x="690" y="485.95" font-size="17" text-anchor="middle">C B</text>
<rect class="cell" x="845" y="431" width="390" height="74" rx="0" fill="#fff0b8"/>
<text x="1040" y="461.95" font-size="17" text-anchor="middle">stage_</text>
<text x="1040" y="485.95" font-size="17" text-anchor="middle">C B</text>
<text x="670" y="420" font-size="15" text-anchor="start" class="mono">G = address of used_ at start of group_data_head</text>
<rect class="cell" x="225" y="550" width="240" height="100" rx="0" fill="#d3eaff"/>
<text x="345" y="593.95" font-size="17" text-anchor="middle">block 0</text>
<text x="345" y="617.95" font-size="17" text-anchor="middle">address G + 3C</text>
<rect class="cell" x="465" y="550" width="240" height="100" rx="0" fill="#d8edd6"/>
<text x="585" y="593.95" font-size="17" text-anchor="middle">block 1</text>
<text x="585" y="617.95" font-size="17" text-anchor="middle">+ S</text>
<rect class="cell" x="705" y="550" width="240" height="100" rx="0" fill="#fff0b8"/>
<text x="825" y="593.95" font-size="17" text-anchor="middle">block 2</text>
<text x="825" y="617.95" font-size="17" text-anchor="middle">+ 2S</text>
<rect class="cell" x="945" y="550" width="290" height="100" rx="0" fill="#f2f3f5"/>
<text x="1090" y="593.95" font-size="17" text-anchor="middle">... block N-1</text>
<text x="1090" y="617.95" font-size="17" text-anchor="middle">N = 2 mobile / 16 other</text>
<path d="M345 505V540" class="line" marker-end="url(#arrow)"/>
<path d="M655 505V540" class="line" marker-end="url(#arrow)"/>
<path d="M1085 505V529H825V540" class="line" marker-end="url(#arrow)"/>
<text x="225" y="697" font-size="16" text-anchor="start">Each block has the same stride S; lists contain indices into this allocation, not separate allocations.</text>
<text x="35" y="752" font-size="19" text-anchor="start" font-weight="700">EXPAND ONE BLOCK · byte offsets from its address B</text>
<path d="M35 787H1215" class="line"/>
<path d="M35 782V793" class="line"/>
<text x="35" y="777" font-size="14" text-anchor="middle" class="mono">+0</text>
<path d="M165 782V793" class="line"/>
<text x="165" y="777" font-size="14" text-anchor="middle" class="mono">+2</text>
<path d="M295 782V793" class="line"/>
<text x="295" y="777" font-size="14" text-anchor="middle" class="mono">+4</text>
<path d="M395 782V793" class="line"/>
<text x="395" y="777" font-size="14" text-anchor="middle" class="mono">+5</text>
<path d="M515 782V793" class="line"/>
<text x="515" y="777" font-size="14" text-anchor="middle" class="mono">+8</text>
<path d="M1215 782V793" class="line"/>
<text x="1215" y="777" font-size="14" text-anchor="middle" class="mono">+128</text>
<rect class="cell" x="35" y="799" width="130" height="79" rx="0" fill="#d3eaff"/>
<text x="100" y="832.45" font-size="17" text-anchor="middle">next index</text>
<text x="100" y="856.45" font-size="17" text-anchor="middle">uint16</text>
<rect class="cell" x="165" y="799" width="130" height="79" rx="0" fill="#fff0b8"/>
<text x="230" y="832.45" font-size="17" text-anchor="middle">ABA tag</text>
<text x="230" y="856.45" font-size="17" text-anchor="middle">uint16</text>
<rect class="cell" x="295" y="799" width="100" height="79" rx="0" fill="#ffd4d0"/>
<text x="345" y="832.45" font-size="17" text-anchor="middle">list type</text>
<text x="345" y="856.45" font-size="17" text-anchor="middle">1 B</text>
<rect class="cell" x="395" y="799" width="120" height="79" rx="0" fill="#f2f3f5"/>
<text x="455" y="832.45" font-size="17" text-anchor="middle">padding</text>
<text x="455" y="856.45" font-size="17" text-anchor="middle">3 B</text>
<rect class="cell" x="515" y="799" width="700" height="79" rx="0" fill="#d8edd6"/>
<text x="865" y="832.45" font-size="17" text-anchor="middle">misc_data_[C - 8]</text>
<text x="865" y="856.45" font-size="17" text-anchor="middle">includes removed / need_reallocate / context</text>
<rect class="cell" x="35" y="929" width="300" height="86" rx="0" fill="#e8dafa"/>
<text x="185" y="965.95" font-size="17" text-anchor="middle">SISO C++ object</text>
<text x="185" y="989.95" font-size="17" text-anchor="middle">at +128, ABI-dependent size</text>
<rect class="cell" x="335" y="929" width="150" height="86" rx="0" fill="#f2f3f5"/>
<text x="410" y="965.95" font-size="17" text-anchor="middle">padding</text>
<text x="410" y="989.95" font-size="17" text-anchor="middle">to D</text>
<rect class="cell" x="485" y="929" width="270" height="86" rx="0" fill="#fff0b8"/>
<text x="620" y="965.95" font-size="17" text-anchor="middle">SISO backing head</text>
<text x="620" y="989.95" font-size="17" text-anchor="middle">4C = 512 B</text>
<rect class="cell" x="755" y="929" width="320" height="86" rx="0" fill="#d3eaff"/>
<text x="915" y="965.95" font-size="17" text-anchor="middle">SISO data</text>
<text x="915" y="989.95" font-size="17" text-anchor="middle">power-of-two capacity</text>
<rect class="cell" x="1075" y="929" width="140" height="86" rx="0" fill="#f2f3f5"/>
<text x="1145" y="965.95" font-size="17" text-anchor="middle">reserve</text>
<text x="1145" y="989.95" font-size="17" text-anchor="middle">C bytes</text>
<text x="35" y="917" font-size="16" text-anchor="start" class="mono">B + C</text>
<text x="485" y="917" font-size="16" text-anchor="start" class="mono">B + D</text>
<text x="755" y="917" font-size="16" text-anchor="start" class="mono">B + D + 4C</text>
<path d="M35 1061V1053H1215V1061" class="line"/>
<text x="625" y="1045" font-size="16" text-anchor="middle">S = D + siso_ring_buffer::calculate_min_size_of_memory(configured_capacity)</text>
<text x="35" y="1120" font-size="18" text-anchor="start">SISO allocation reserves 4C header + rounded data capacity + C extra bytes.</text>
<text x="35" y="1161" font-size="17" text-anchor="start">Normal heap mode omits the leading mmap checksum metadata; used_/free_/stage_ still occupy 3C.</text>
<text x="28" y="1213" font-size="16" text-anchor="start" class="note">Example checked on Windows x64 Release: SISO object 40 B, D = 256 B. Do not assume this ABI everywhere.</text>
<text x="28" y="1245" font-size="16" text-anchor="start" class="note">This is the memory structure behind the routing picture, not a collection of independent boxes.</text>
</svg>
