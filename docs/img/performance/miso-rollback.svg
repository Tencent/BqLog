<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1010" viewBox="0 0 1280 1010" role="img" aria-labelledby="title desc"><title id="title">Fetch-add overflow: rollback must respect reservation order</title><desc id="desc">A logical reservation example shows A, B and C ranges, a broken subtraction creating overlap, and correct tail rollback with compare exchange.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#222b35" stroke-width="1.6"/></marker><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 9L9 0M7 11L11 7" stroke="#b8bec7" stroke-width="1"/></pattern></defs><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#222b35}.mono{font-family:Consolas,'Courier New',monospace}.note{fill:#64717e}.cell{stroke:#222b35;stroke-width:1.5}.line{fill:none;stroke:#222b35;stroke-width:1.7}.guide{fill:none;stroke:#8b96a2;stroke-width:1.2;stroke-dasharray:5 5}</style><rect width="1280" height="1010" fill="white"/>
<text x="28" y="38" font-size="25" text-anchor="start" font-weight="700">Fetch-add overflow: rollback must respect reservation order</text>
<text x="28" y="71" font-size="16" text-anchor="start" class="note">Logical allocation units for teaching; actual MISO reservations are rounded to 128-byte blocks.</text>
<text x="28" y="126" font-size="19" text-anchor="start" font-weight="700">1 · All producers saw capacity; fetch-add reservations push In beyond Limit</text>
<rect class="cell" x="100" y="161" width="280" height="85" rx="0" fill="#d8edd6"/>
<text x="240" y="197.45" font-size="17" text-anchor="middle">A</text>
<text x="240" y="221.45" font-size="17" text-anchor="middle">[1000,1010)</text>
<rect class="cell" x="380" y="161" width="140" height="85" rx="0" fill="#fff0b8"/>
<text x="450" y="197.45" font-size="17" text-anchor="middle">B</text>
<text x="450" y="221.45" font-size="17" text-anchor="middle">[1010,1015)</text>
<rect class="cell" x="520" y="161" width="420" height="85" rx="0" fill="#ffd4d0"/>
<text x="730" y="197.45" font-size="17" text-anchor="middle">C</text>
<text x="730" y="221.45" font-size="17" text-anchor="middle">[1015,1030)</text>
<path d="M436 273V151" class="line" marker-end="url(#arrow)"/>
<text x="436" y="301" font-size="17" text-anchor="middle" font-weight="700">Limit = 1012</text>
<text x="100" y="144" font-size="16" text-anchor="start">1000</text>
<text x="940" y="144" font-size="16" text-anchor="middle">In = 1030</text>
<text x="28" y="365" font-size="19" text-anchor="start" font-weight="700">2 · Wrong: B subtracts 5; capacity later grows, and B reserves again</text>
<rect class="cell" x="100" y="404" width="280" height="93" rx="0" fill="#d8edd6"/>
<text x="240" y="444.45" font-size="17" text-anchor="middle">A</text>
<text x="240" y="468.45" font-size="17" text-anchor="middle">[1000,1010)</text>
<rect class="cell" x="380" y="404" width="140" height="93" rx="0" fill="#f2f3f5"/>
<text x="450" y="444.45" font-size="17" text-anchor="middle">hole</text>
<text x="450" y="468.45" font-size="17" text-anchor="middle">5 units</text>
<rect class="cell" x="520" y="404" width="280" height="93" rx="0" fill="#ffd4d0"/>
<text x="660" y="444.45" font-size="17" text-anchor="middle">C still owns</text>
<text x="660" y="468.45" font-size="17" text-anchor="middle">[1015,1030)</text>
<rect class="cell" x="800" y="404" width="140" height="93" rx="0" fill="#e8dafa"/>
<text x="870" y="444.45" font-size="17" text-anchor="middle">C AND B</text>
<text x="870" y="468.45" font-size="17" text-anchor="middle">[1025,1030)</text>
<rect class="cell" x="940" y="404" width="280" height="93" rx="0" fill="#f2f3f5"/>
<text x="1080" y="444.45" font-size="17" text-anchor="middle">new free space</text>
<text x="1080" y="468.45" font-size="17" text-anchor="middle">to 1040</text>
<text x="100" y="540" font-size="17" text-anchor="start">B: In 1030 → 1025 → reserves [1025,1030). C can now see enough capacity and use its old range.</text>
<text x="100" y="573" font-size="17" text-anchor="start" font-weight="700">Two producers can write the same bytes. Subtracting a reservation length does not cancel that reservation.</text>
<text x="28" y="641" font-size="19" text-anchor="start" font-weight="700">3 · Correct: cancel only when this reservation is at the tail</text>
<rect class="cell" x="100" y="679" width="280" height="78" rx="0" fill="#d8edd6"/>
<text x="240" y="711.95" font-size="17" text-anchor="middle">A</text>
<text x="240" y="735.95" font-size="17" text-anchor="middle">retained</text>
<rect class="cell" x="380" y="679" width="140" height="78" rx="0" fill="#fff0b8"/>
<text x="450" y="711.95" font-size="17" text-anchor="middle">B</text>
<text x="450" y="735.95" font-size="17" text-anchor="middle">next to rollback</text>
<rect class="cell" x="520" y="679" width="420" height="78" rx="0" fill="#ffd4d0"/>
<text x="730" y="711.95" font-size="17" text-anchor="middle">C</text>
<text x="730" y="735.95" font-size="17" text-anchor="middle">roll back first</text>
<path d="M940 787H520" class="line" marker-end="url(#arrow)"/>
<text x="730" y="818" font-size="18" text-anchor="middle" font-weight="700" class="mono">CAS In: 1030 → 1015</text>
<path d="M520 855H380" class="line" marker-end="url(#arrow)"/>
<text x="670" y="884" font-size="18" text-anchor="middle" font-weight="700" class="mono">then CAS In: 1015 → 1010</text>
<text x="28" y="943" font-size="16" text-anchor="start" class="note">A rollback retry may instead discover that the consumer has released enough capacity: keep the reservation.</text>
<text x="28" y="977" font-size="16" text-anchor="start" class="note">This is a capacity slow path, not a claim that all reservations finish in a fixed number of steps.</text>
</svg>
